version: '3.8'

services:
  # Isolated PostgreSQL Database container (avoids colliding with host ports 5432 & 5433)
  postgres:
    image: postgres:16-alpine
    container_name: devflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-devflow_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - devflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow_user} -d ${POSTGRES_DB:-devflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devflow-network

  # Backend Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devflow-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://${POSTGRES_USER:-devflow_user}:${POSTGRES_PASSWORD:-devflow_secure_password_123}@postgres:5432/${POSTGRES_DB:-devflow_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-devflow_docker_production_secret_32_characters}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devflow-network

  # Frontend React Vite app
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - devflow-network

volumes:
  devflow_pgdata:
    driver: local

networks:
  devflow-network:
    driver: bridge
