<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Dark Navy Glassmorphism Background -->
    <linearGradient id="df-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Subtle Cyber Glow Border -->
    <linearGradient id="df-border" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5" />
    </linearGradient>

    <!-- Left Spine: Cyan to Electric Blue to Indigo Lightning -->
    <linearGradient id="df-lightning" x1="22" y1="18" x2="54" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Right Arc: Violet to Magenta to Hot Pink D-Wing -->
    <linearGradient id="df-arc" x1="48" y1="18" x2="84" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Central Radial Ambient Glow -->
    <radialGradient id="df-ambient" cx="48" cy="48" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded Square Container -->
  <rect width="98" height="98" x="1" y="1" rx="24" fill="url(#df-bg)" stroke="url(#df-border)" stroke-width="2" />
  <circle cx="50" cy="50" r="42" fill="url(#df-ambient)" />

  <!-- D-Lightning Mark: Left Lightning Spine -->
  <path d="M46 18 L24 49 L42 49 L28 82 L58 45 L40 45 L54 18 Z" fill="url(#df-lightning)" />

  <!-- D-Lightning Mark: Right Aerodynamic Flow Loop -->
  <path d="M54 18 C71 18 84 31 84 50 C84 69 71 82 54 82 L46 82 L53 72 C65 72 73 63 73 50 C73 37 65 28 53 28 L47 28 L54 18 Z" fill="url(#df-arc)" />
</svg>